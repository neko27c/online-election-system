<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アカウント削除</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'administrator/voter_delete.css' %}">
</head>
<body>
<div class="delete-container">

<div class="top-buttons">
    <a href="{% url 'administrator:main_menu' %}" class="back-btn">
        管理者メニューに戻る
    </a>
</div>

<h1>アカウント削除</h1>

{% if messages %}
<div class="message-box">
    {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<!-- 検索 -->
<form method="get" class="search-box">
    <label>
        氏名：
        <input type="text" name="name" value="{{ name }}">
    </label>

    <label>
        生年月日：
        <input type="date" name="birth_date" value="{{ birth_date }}">
    </label>

    <button type="submit">検索</button>
</form>

<!-- 一括削除 form（ここが重要） -->
<form method="post" action="{% url 'administrator:voter_delete_list' %}">
    {% csrf_token %}

    <button type="submit" class="action-btn">一括削除</button>

    <table class="voter-table">
        <thead>
            <tr>
                <th>チェック</th>
                <th>氏名</th>
                <th>生年月日</th>
                <th>住所</th>
                <th>コード</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
        {% for v in voters %}
            <tr>
                <td>
                    <input type="checkbox" name="selected_voters" value="{{ v.id }}">
                </td>
                <td>{{ v.name }}</td>
                <td>{{ v.birth_date }}</td>
                <td>{{ v.address }}</td>
                <td>{{ v.status }}</td>
                <td>
                    <!-- 個別削除はJSでPOST -->
                    <button type="button"
                            class="delete-btn"
                            onclick="deleteVoter({{ v.id }})">
                        削除
                    </button>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="6">検索してください</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</form>

</div>
</body>
</html>

<script>
function deleteVoter(id) {
    if (!confirm("本当に削除しますか？")) return;

    const form = document.createElement("form");
    form.method = "post";
    form.action = `/administrator/voter/delete/${id}/`;

    const csrf = document.createElement("input");
    csrf.type = "hidden";
    csrf.name = "csrfmiddlewaretoken";
    csrf.value = "{{ csrf_token }}";

    form.appendChild(csrf);
    document.body.appendChild(form);
    form.submit();
}
</script>
